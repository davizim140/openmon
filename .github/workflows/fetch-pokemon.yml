name: Fetch 9 Gens

on:
  schedule:
    - cron: '0 3 * * *' # todo dia 3h da manhã
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - name: Baixar Gens 1-9
        run: node scripts/fetch-gen9.js

      - name: Commit se mudou algo
        run: |
          git config user.name "openmon-bot"
          git config user.email "bot@openmon.local"
          git add src/assets/pokemons-gen9.json POKEMON_LIST public/sprites
          git diff --staged --quiet || git commit -m "chore: update pokemons to 9 gens [skip ci]"
          git push
