name: Deploy OpenMon 9 Gens

on:
  push:
    branches: [master]
  workflow_dispatch: # pra rodar manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # o OpenMon já builda pra docs/
          branch: gh-pages
